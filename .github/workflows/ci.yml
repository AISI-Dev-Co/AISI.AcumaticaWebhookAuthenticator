name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Core and tests only: the adapter needs licensed PX.* assemblies from a site Bin.
      - name: Restore
        run: dotnet restore tests/AISI.AcumaticaWebhookAuthenticator.Core.Tests

      - name: Build
        run: dotnet build tests/AISI.AcumaticaWebhookAuthenticator.Core.Tests --no-restore --configuration Release

      - name: Test
        run: dotnet test tests/AISI.AcumaticaWebhookAuthenticator.Core.Tests --no-build --configuration Release --verbosity normal

      - name: Pack
        run: dotnet pack src/AISI.AcumaticaWebhookAuthenticator.Core --no-build --configuration Release --output ./artifacts

      # Acumatica assemblies are licensed and must never be redistributed.
      - name: Assert no Acumatica assemblies in the package
        run: |
          set -euo pipefail
          for pkg in ./artifacts/*.nupkg; do
            echo "Inspecting $pkg"
            if unzip -l "$pkg" | grep -Ei 'PX\..*\.dll'; then
              echo "::error::$pkg contains an Acumatica assembly"
              exit 1
            fi
          done
          echo "No Acumatica assemblies found."

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*.nupkg
          if-no-files-found: error
